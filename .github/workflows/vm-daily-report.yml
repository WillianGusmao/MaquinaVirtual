name: Relatorio diario de tentativas da VM

on:
  schedule:
    - cron: '0 10 * * *'  # 07:00 em Brasilia (UTC-3)
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPPRESS_LABEL_WARNING: "True"

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Instalar OCI CLI e jq
        run: |
          python3 -m pip install --upgrade pip
          pip install oci-cli
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Configurar OCI
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          set -euo pipefail

          mkdir -p ~/.oci

          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${OCI_USER_OCID}
          fingerprint=${OCI_FINGERPRINT}
          tenancy=${OCI_TENANCY_OCID}
          region=${OCI_REGION}
          key_file=~/.oci/oci_api_key.pem
          EOF

          printf '%b' "$OCI_PRIVATE_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem ~/.oci/config

          if ! head -n 1 ~/.oci/oci_api_key.pem | grep -Eq 'BEGIN .*PRIVATE KEY'; then
            echo "::error::A private key não parece estar em formato PEM válido."
            exit 1
          fi

      - name: Montar e enviar relatorio
        env:
          STACK_OCID: ${{ secrets.STACK_OCID }}
          COMPARTMENT_OCID: ${{ secrets.COMPARTMENT_OCID }}
          VM_DISPLAY_NAME: ${{ secrets.VM_DISPLAY_NAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          # Verifica se a VM ja subiu, so pra dar contexto no relatorio.
          INSTANCE_JSON=$(oci compute instance list \
            --compartment-id "$COMPARTMENT_OCID" \
            --all \
            --output json)

          VM_STATE=$(echo "$INSTANCE_JSON" | jq -r \
            --arg NAME "$VM_DISPLAY_NAME" \
            '.data[] | select(."display-name" == $NAME) | ."lifecycle-state"' | head -n 1)

          # Janela: ultimas 24h (equivalente ao "dia" que terminou agora, 07h de hoje).
          # Brasilia = UTC-3 fixo (sem horario de verao desde 2019); usamos epoch
          # em vez de TZ=America/Sao_Paulo pra nao depender de tzdata estar instalado no runner.
          CUTOFF=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%S)
          NOW_LOCAL=$(date -u -d "@$(( $(date -u +%s) - 3*3600 ))" '+%d/%m/%Y %H:%M')

          JOBS_JSON=$(oci resource-manager job list \
            --stack-id "$STACK_OCID" \
            --all \
            --output json)

          # time-created + lifecycle-state de cada tentativa, uma por linha, em ordem cronologica.
          ROWS=$(echo "$JOBS_JSON" | jq -r --arg cutoff "$CUTOFF" '
            .data[]
            | select(.operation == "APPLY")
            | select(."time-created" >= $cutoff)
            | [."time-created", ."lifecycle-state"]
            | @tsv
          ' | sort)

          declare -A COUNT
          for h in $(seq -w 0 23); do COUNT["$h"]=0; done

          TOTAL=0
          LISTING=""
          while IFS=$'\t' read -r TS STATE; do
            [ -z "$TS" ] && continue

            EPOCH=$(date -u -d "$TS" +%s)
            LOCAL_EPOCH=$((EPOCH - 3*3600))
            LOCAL_HOUR_STR=$(date -u -d "@$LOCAL_EPOCH" +%H)
            COUNT["$LOCAL_HOUR_STR"]=$(( ${COUNT[$LOCAL_HOUR_STR]:-0} + 1 ))
            TOTAL=$((TOTAL + 1))

            LOCAL_TS=$(date -u -d "@$LOCAL_EPOCH" '+%d/%m %H:%M')
            LISTING="${LISTING}${TOTAL}. ${LOCAL_TS} - ${STATE}"$'\n'
          done <<< "$ROWS"

          AVG=$(awk "BEGIN{printf \"%.1f\", $TOTAL/24}")

          MAX_HOUR="" ; MAX_COUNT=-1
          MIN_HOUR="" ; MIN_COUNT=999999
          for h in $(seq -w 0 23); do
            c=${COUNT[$h]}
            if [ "$c" -gt "$MAX_COUNT" ]; then MAX_COUNT=$c; MAX_HOUR=$h; fi
            if [ "$c" -lt "$MIN_COUNT" ]; then MIN_COUNT=$c; MIN_HOUR=$h; fi
          done

          if [ "$VM_STATE" = "RUNNING" ]; then
            STATUS_LINE="Status: a VM ja esta RUNNING (sem novas tentativas)."
          else
            STATUS_LINE="Status: a VM ainda nao subiu, tentativas continuam a cada 5 min."
          fi

          MSG=$(printf 'Relatorio diario - tentativas de criar a VM Oracle\nAte %s (Brasilia), ultimas 24h\n\nTotal de tentativas: %s\nMedia por hora: %s\nHorario com mais tentativas: %sh (%s)\nHorario com menos tentativas: %sh (%s)\n\n%s' \
            "$NOW_LOCAL" "$TOTAL" "$AVG" "$MAX_HOUR" "$MAX_COUNT" "$MIN_HOUR" "$MIN_COUNT" "$STATUS_LINE")

          echo "$MSG"
          echo "---"
          echo "$LISTING"

          send_telegram() {
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
              --data-urlencode text="$1" > /dev/null
          }

          send_telegram "$MSG"

          if [ "$TOTAL" -eq 0 ]; then
            send_telegram "Listagem de tentativas: nenhuma tentativa nas ultimas 24h."
          else
            # Telegram limita 4096 caracteres por mensagem; quebra a listagem em blocos seguros.
            CHUNK=""
            CHUNK_HEADER="Listagem de tentativas (${TOTAL}):"$'\n'
            CHUNK="$CHUNK_HEADER"
            while IFS= read -r LINE; do
              [ -z "$LINE" ] && continue
              if [ $(( ${#CHUNK} + ${#LINE} + 1 )) -gt 3500 ]; then
                send_telegram "$CHUNK"
                CHUNK=""
              fi
              CHUNK="${CHUNK}${LINE}"$'\n'
            done <<< "$LISTING"
            [ -n "$CHUNK" ] && send_telegram "$CHUNK"
          fi
