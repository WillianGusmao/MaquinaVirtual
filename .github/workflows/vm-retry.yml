name: Tentar subir a VM

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: vm-retry
  cancel-in-progress: false

env:
  SUPPRESS_LABEL_WARNING: "True"

jobs:
  retry-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Instalar OCI CLI e jq
        run: |
          python3 -m pip install --upgrade pip
          pip install oci-cli
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Configurar OCI
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          set -euo pipefail

          mkdir -p ~/.oci

          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${OCI_USER_OCID}
          fingerprint=${OCI_FINGERPRINT}
          tenancy=${OCI_TENANCY_OCID}
          region=${OCI_REGION}
          key_file=~/.oci/oci_api_key.pem
          EOF

          # Aceita private key salva com \n ou com quebras reais
          printf '%b' "$OCI_PRIVATE_KEY" > ~/.oci/oci_api_key.pem

          chmod 600 ~/.oci/oci_api_key.pem ~/.oci/config

          # Validação básica da chave
          if ! head -n 1 ~/.oci/oci_api_key.pem | grep -Eq 'BEGIN .*PRIVATE KEY'; then
            echo "::error::A private key não parece estar em formato PEM válido."
            exit 1
          fi

      - name: Verificar se a VM já está ativa
        id: vm_check
        env:
          COMPARTMENT_OCID: ${{ secrets.COMPARTMENT_OCID }}
          VM_DISPLAY_NAME: ${{ secrets.VM_DISPLAY_NAME }}
        run: |
          set -euo pipefail

          echo "Verificando instâncias no compartment..."

          INSTANCE_JSON=$(oci compute instance list \
            --compartment-id "$COMPARTMENT_OCID" \
            --all \
            --output json)

          STATE=$(echo "$INSTANCE_JSON" | jq -r \
            --arg NAME "$VM_DISPLAY_NAME" \
            '.data[]
             | select(."display-name" == $NAME)
             | ."lifecycle-state"
             ' | head -n 1)

          if [ "${STATE:-}" = "RUNNING" ]; then
            echo "A VM já está RUNNING. Nada a fazer."

            INSTANCE_ID=$(echo "$INSTANCE_JSON" | jq -r \
              --arg NAME "$VM_DISPLAY_NAME" \
              '.data[] | select(."display-name" == $NAME) | .id' | head -n 1)

            echo "should_apply=false" >> "$GITHUB_OUTPUT"
            echo "reason=vm_running" >> "$GITHUB_OUTPUT"
            echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "A VM ainda não está RUNNING."
          echo "should_apply=check_jobs" >> "$GITHUB_OUTPUT"
          echo "reason=vm_not_running" >> "$GITHUB_OUTPUT"

      - name: Heartbeat as 12h, 18h e 23h em Brasilia (ainda não subiu)
        if: steps.vm_check.outputs.reason == 'vm_not_running'
        env:
          STACK_OCID: ${{ secrets.STACK_OCID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          # Checkpoints em Brasilia (UTC-3): 12h, 18h, 23h -> UTC: 15h, 21h, 02h.
          # O relatorio completo das 7h (vm-daily-report.yml) ja cobre o "6h da manha";
          # este heartbeat so cobre os outros tres, cada um reportando as tentativas
          # desde o checkpoint anterior (nao desde o inicio do dia).
          # Janela de 2h em cada alvo pra tolerar o atraso irregular do schedule do GitHub.
          HOUR=$((10#$(date -u +%H)))

          SINCE_HOUR="" ; CUTOFF_DATE=$(date -u +%Y-%m-%d)
          case "$HOUR" in
            15|16) SINCE_HOUR=10 ;;                                   # 12h BR, desde as 7h BR
            21|22) SINCE_HOUR=15 ;;                                   # 18h BR, desde as 12h BR
            2|3)   SINCE_HOUR=21 ; CUTOFF_DATE=$(date -u -d 'yesterday' +%Y-%m-%d) ;;  # 23h BR, desde as 18h BR
          esac

          if [ -z "$SINCE_HOUR" ]; then
            echo "Fora das janelas de heartbeat (hora atual UTC: ${HOUR}). Nada a enviar."
            exit 0
          fi

          CUTOFF="${CUTOFF_DATE}T$(printf '%02d' "$SINCE_HOUR"):00:00"

          JOBS_JSON=$(oci resource-manager job list --stack-id "$STACK_OCID" --all --output json)
          COUNT=$(echo "$JOBS_JSON" | jq -r --arg cutoff "$CUTOFF" '
            [.data[] | select(.operation == "APPLY") | select(."time-created" >= $cutoff)] | length
          ')

          MSG="Ainda tentando criar a VM Oracle - ${COUNT} tentativa(s) neste periodo (ate $(date -u '+%H:%M UTC'))."
          echo "$MSG"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode text="$MSG"
          echo ""

      - name: Disparar relatorio diario (~7h em Brasilia)
        if: steps.vm_check.outputs.reason == 'vm_not_running'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # O cron proprio do vm-daily-report.yml (10h UTC) nao vem disparando sozinho
          # de forma confiavel, entao usamos este workflow - que roda com frequencia
          # comprovada - como gatilho de apoio. Janela ampla (10h-10h59 UTC = ~7h em
          # Brasilia) porque os runs deste workflow nao caem sempre perto do minuto 0.
          HOUR=$((10#$(date -u +%H)))

          if [ "$HOUR" -eq 10 ]; then
            TODAY=$(date -u +%Y-%m-%d)
            ALREADY_RAN=$(gh run list -R "${{ github.repository }}" --workflow=vm-daily-report.yml --limit 5 \
              --json createdAt --jq --arg today "$TODAY" '[.[] | select(.createdAt | startswith($today))] | length')

            if [ "${ALREADY_RAN:-0}" -gt 0 ]; then
              echo "Relatorio diario ja rodou hoje ($TODAY, $ALREADY_RAN vez(es)). Nao vou disparar de novo."
            else
              echo "Dentro da janela do relatorio diario (10h UTC), nenhum run hoje ainda. Disparando..."
              gh workflow run vm-daily-report.yml -R "${{ github.repository }}" || true
            fi
          else
            echo "Fora da janela do relatorio diario (hora atual UTC: ${HOUR}). Nada a fazer."
          fi

      - name: Avisar no Telegram e desativar o workflow
        if: steps.vm_check.outputs.reason == 'vm_running'
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INSTANCE_ID: ${{ steps.vm_check.outputs.instance_id }}
        run: |
          set -euo pipefail

          PUBLIC_IP=$(oci compute instance list-vnics \
            --instance-id "$INSTANCE_ID" \
            --query "data[0].\"public-ip\"" \
            --raw-output 2>/dev/null || echo "")

          MSG="A VM Oracle subiu! IP publico: ${PUBLIC_IP:-nao disponivel ainda}"
          echo "$MSG"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode text="$MSG"

          echo "Desativando o workflow (missão cumprida, não precisa mais tentar)..."
          gh workflow disable vm-retry.yml -R "${{ github.repository }}" || true

      - name: Analisar último job da stack
        id: decision
        if: steps.vm_check.outputs.should_apply == 'check_jobs'
        env:
          STACK_OCID: ${{ secrets.STACK_OCID }}
        run: |
          set -euo pipefail

          echo "Verificando jobs da stack..."

          set +e
          JOBS_JSON=$(oci resource-manager job list \
            --stack-id "$STACK_OCID" \
            --all \
            --output json 2>&1)
          STATUS=$?
          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo "$JOBS_JSON"
            echo "::error::Falha ao listar jobs da stack."
            exit 1
          fi

          LAST_JOB_ID=$(echo "$JOBS_JSON" | jq -r '
            .data
            | sort_by(."time-created")
            | if length > 0 then last.id else "" end
          ')

          LAST_JOB_STATE=$(echo "$JOBS_JSON" | jq -r '
            .data
            | sort_by(."time-created")
            | if length > 0 then last."lifecycle-state" else "" end
          ')

          if [ -z "$LAST_JOB_ID" ]; then
            echo "Nenhum job anterior encontrado. Vou disparar o APPLY."
            echo "should_apply=true" >> "$GITHUB_OUTPUT"
            echo "reason=no_previous_job" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Último job: $LAST_JOB_ID"
          echo "Estado do último job: $LAST_JOB_STATE"

          case "$LAST_JOB_STATE" in
            SUCCEEDED)
              echo "O último apply já foi concluído com sucesso."
              echo "should_apply=false" >> "$GITHUB_OUTPUT"
              echo "reason=last_job_succeeded" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            ACCEPTED|IN_PROGRESS|CANCELING)
              echo "Já existe um job em andamento. Não vou disparar outro."
              echo "should_apply=false" >> "$GITHUB_OUTPUT"
              echo "reason=job_in_progress" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          echo "Buscando o log do último job (a mensagem de capacidade só aparece aqui, não em 'job get')..."
          set +e
          JOB_LOG=$(oci resource-manager job get-job-logs-content \
            --job-id "$LAST_JOB_ID" \
            --output json)
          STATUS=$?
          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo "$JOB_LOG"
            echo "::error::Falha ao obter o log do último job."
            exit 1
          fi

          if echo "$JOB_LOG" | grep -Ei \
            '(OutOfHostCapacity|out of host capacity|No capacity|insufficient capacity|capacity|sem capacidade|sem espaço|insufficient resources|host capacity)' >/dev/null; then
            echo "Falha por capacidade detectada. Vou reenfileirar o APPLY."
            echo "should_apply=true" >> "$GITHUB_OUTPUT"
            echo "reason=capacity_failure" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "O último job falhou por outro motivo."
          echo "Não vou reenfileirar automaticamente."
          echo "should_apply=false" >> "$GITHUB_OUTPUT"
          echo "reason=non_capacity_failure" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Disparar APPLY do stack
        if: steps.decision.outputs.should_apply == 'true'
        env:
          STACK_OCID: ${{ secrets.STACK_OCID }}
        run: |
          set -euo pipefail

          JOB_ID=$(oci resource-manager job create-apply-job \
            --stack-id "$STACK_OCID" \
            --display-name "retry-vm-$(date +%Y%m%d-%H%M%S)" \
            --execution-plan-strategy AUTO_APPROVED \
            --query "data.id" \
            --raw-output)

          echo "Job disparado: $JOB_ID"
          echo "Motivo: ${{ steps.decision.outputs.reason }}"
